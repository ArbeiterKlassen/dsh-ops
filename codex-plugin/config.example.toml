# Direct MCP-server configuration for Codex.
# Use this when you do not want to install the plugin from a marketplace.

[mcp_servers.dsh_ops]
command = "node"
args = ["./codex-plugin/scripts/native-mcp.mjs"]
cwd = "."
startup_timeout_sec = 60
tool_timeout_sec = 300
default_tools_approval_mode = "prompt"
enabled_tools = [
  "inspect_local_file",
  "grep",
  "glob",
  "replace",
  "write_file",
  "edit_file",
  "diff",
  "stat",
  "copy",
  "move",
  "remove",
  "read_files",
  "read_table",
  "read_docx",
  "read_pdf",
  "result",
]

[mcp_servers.dsh_ops.tools.edit_file]
approval_mode = "approve"

[mcp_servers.dsh_ops.tools.replace]
approval_mode = "approve"

[mcp_servers.dsh_ops.tools.write_file]
approval_mode = "approve"

[mcp_servers.dsh_ops.tools.remove]
approval_mode = "approve"

# Optional safety controls:
# DSH_OPS_READ_ONLY=1 rejects mutations.
# DSH_OPS_WRITE_ROOT=C:\path restricts workspace-write calls to that tree.
# DSH_OPS_WORKSPACE_ROOT=C:\path resolves relative paths in direct MCP mode.
