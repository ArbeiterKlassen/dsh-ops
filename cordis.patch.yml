
# Four independent components. PTC and the read-only TUI panel are opt-in.
# Legacy shell and file stay enabled; neither is required by the PTC component.
# The former dsh-ops/background row is no longer inserted; existing rows load as a no-op stub.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        required: false
    - id: dsh-ops-ptc
      name: dsh-ops/ptc
      disabled: true
      config:
        required: false
    - id: dsh-ops-tui
      name: dsh-ops/tui
      disabled: true
      config:
        maxSessions: 32
        maxActive: 128
        recentLimit: 8
