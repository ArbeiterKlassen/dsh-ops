
# Five independent components. PTC, the read-only TUI panel, and strict
# official-tool hiding are opt-in: the hide-official row stays disabled until an
# operator explicitly enables it for a complete native surface.
# Legacy shell and file stay enabled; neither is required by the PTC component.
# The former dsh-ops/background row is no longer inserted; existing rows load as a no-op stub.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        required: false
    - id: dsh-ops-ptc
      name: dsh-ops/ptc
      disabled: true
      config:
        required: false
    - id: dsh-ops-tui
      name: dsh-ops/tui
      disabled: true
      config:
        maxSessions: 32
        maxActive: 128
        recentLimit: 8
    - id: dsh-ops-hide-official
      name: dsh-ops/hide-official
      disabled: true
      config:
        strict: true
        additionalOfficialTools: []
