# Five independent components. The shell defaults on only on Windows; TUI is opt-in.
# Strict official-tool hiding is disabled until explicitly enabled for a complete native surface.
# Existing dsh-ops/background rows load as a no-op stub.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      disabled: !!js process.platform !== "win32"
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        required: false
    - id: dsh-ops-ptc
      name: dsh-ops/ptc
      config:
        required: false
    - id: dsh-ops-tui
      name: dsh-ops/tui
      disabled: true
      config:
        maxSessions: 32
        maxActive: 128
        recentLimit: 8
    - id: dsh-ops-hide-official
      name: dsh-ops/hide-official
      disabled: true
      config:
        strict: true
        additionalOfficialTools: []
