# Three independent components. PTC is opt-in, scoped to pure PTC sessions.
# Legacy shell and file stay enabled; neither is required by the PTC component.
# The former dsh-ops/background row is no longer inserted; existing rows load as a no-op stub.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        required: false
    - id: dsh-ops-ptc
      name: dsh-ops/ptc
      disabled: true
      config:
        required: false
